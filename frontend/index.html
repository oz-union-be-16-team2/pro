<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MNJP 테스트 클라이언트</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 16px; max-width: 900px; margin: 0 auto; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 12px 0; }
    input, button { padding: 10px; font-size: 14px; }
    input { width: 220px; }
    button { cursor: pointer; }
    pre { background: #0b1020; color: #d6e3ff; padding: 12px; border-radius: 10px; overflow: auto; }
    .muted { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>MNJP 사용자 화면 테스트</h1>
  <div class="muted">
    Swagger 말고 “유저 화면”에서 API 호출하는 테스트용 페이지.
  </div>

  <div class="card">
    <h2>서버 주소</h2>
    <div class="row">
      <input id="baseUrl" value="http://127.0.0.1:8000/api/v1" />
      <button onclick="saveBaseUrl()">저장</button>
    </div>
  </div>

  <div class="card">
    <h2>회원가입 / 로그인</h2>
    <div class="row">
      <input id="username" placeholder="username" value="testuser" />
      <input id="password" placeholder="password" type="password" value="testpassword123" />
    </div>
    <div class="row" style="margin-top:8px;">
      <button onclick="signup()">회원가입</button>
      <button onclick="login()">로그인</button>
      <button onclick="logout()">로그아웃</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <input id="token" placeholder="access_token" style="width: 720px;" />
      <button onclick="saveToken()">토큰 저장</button>
    </div>
  </div>

  <div class="card">
    <h2>질문</h2>
    <div class="row">
      <input id="qCategory" placeholder="category (optional)" />
      <button onclick="randomQuestion()">랜덤 질문 받기</button>
      <button onclick="myQuestionHistory()">내 질문 히스토리</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <input id="limit" placeholder="limit" value="20" />
      <input id="offset" placeholder="offset" value="0" />
    </div>
  </div>

  <div class="card">
    <h2>명언</h2>
    <div class="row">
      <input id="pages" placeholder="scrape pages" value="1" />
      <button onclick="scrapeQuotes()">명언 스크래핑</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <input id="quoteLimit" placeholder="limit" value="1" />
      <input id="quoteAuthor" placeholder="author (optional)" />
      <button onclick="randomQuotes()">랜덤 명언</button>
    </div>
  </div>

  <div class="card">
    <h2>결과</h2>
    <pre id="out">{}</pre>
  </div>

<script>
  const out = (obj) => {
    document.getElementById("out").textContent =
      typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
  };

  const getBaseUrl = () => localStorage.getItem("baseUrl") || document.getElementById("baseUrl").value;
  const getToken = () => localStorage.getItem("token") || document.getElementById("token").value;

  const saveBaseUrl = () => {
    const v = document.getElementById("baseUrl").value.trim();
    localStorage.setItem("baseUrl", v);
    out({ savedBaseUrl: v });
  };

  const saveToken = () => {
    const v = document.getElementById("token").value.trim();
    localStorage.setItem("token", v);
    out({ savedToken: v ? "OK" : "EMPTY" });
  };

  const logout = () => {
    localStorage.removeItem("token");
    document.getElementById("token").value = "";
    out({ logout: "OK" });
  };

  const api = async (path, { method="GET", body=null, auth=false } = {}) => {
    const baseUrl = getBaseUrl();
    const headers = { "Content-Type": "application/json" };
    if (auth) {
      const token = getToken();
      if (!token) throw new Error("토큰 없음. 로그인 후 토큰 저장해.");
      headers["Authorization"] = `Bearer ${token}`;
    }
    const res = await fetch(`${baseUrl}${path}`, {
      method,
      headers,
      body: body ? JSON.stringify(body) : null,
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}\n` + (typeof data === "string" ? data : JSON.stringify(data, null, 2)));
    }
    return data;
  };

  async function signup() {
    try {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const data = await api("/auth/signup", { method: "POST", body: { username, password } });
      out(data);
    } catch (e) { out(String(e)); }
  }

  async function login() {
    try {
      // OAuth2PasswordRequestForm은 x-www-form-urlencoded라서 fetch 따로 처리
      const baseUrl = getBaseUrl();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const res = await fetch(`${baseUrl}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ username, password }),
      });

      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      if (!res.ok) throw new Error(`HTTP ${res.status}\n` + (typeof data === "string" ? data : JSON.stringify(data, null, 2)));

      document.getElementById("token").value = data.access_token || "";
      localStorage.setItem("token", data.access_token || "");
      out(data);
    } catch (e) { out(String(e)); }
  }

  async function randomQuestion() {
    try {
      const category = document.getElementById("qCategory").value.trim();
      const payload = category ? { category } : {};
      const data = await api("/questions/random", { method: "POST", body: payload, auth: true });
      out(data);
    } catch (e) { out(String(e)); }
  }

  async function myQuestionHistory() {
    try {
      const limit = Number(document.getElementById("limit").value || 20);
      const offset = Number(document.getElementById("offset").value || 0);
      const data = await api(`/questions/me/history?limit=${limit}&offset=${offset}`, { auth: true });
      out(data);
    } catch (e) { out(String(e)); }
  }

  async function scrapeQuotes() {
    try {
      const pages = Number(document.getElementById("pages").value || 1);
      const data = await api(`/quotes/scrape?pages=${pages}`, { method: "POST" });
      out(data);
    } catch (e) { out(String(e)); }
  }

  async function randomQuotes() {
    try {
      const limit = Number(document.getElementById("quoteLimit").value || 1);
      const author = document.getElementById("quoteAuthor").value.trim();
      const q = author ? `&author=${encodeURIComponent(author)}` : "";
      const data = await api(`/quotes/random?limit=${limit}${q}`);
      out(data);
    } catch (e) { out(String(e)); }
  }

  // 초기값 로드
  (function init(){
    const savedBase = localStorage.getItem("baseUrl");
    if (savedBase) document.getElementById("baseUrl").value = savedBase;
    const savedToken = localStorage.getItem("token");
    if (savedToken) document.getElementById("token").value = savedToken;
  })();
</script>
</body>
</html>
